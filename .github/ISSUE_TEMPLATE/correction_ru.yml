name: "Исправление статьи / примера (RU)"
description: "Предложить материал или улучшить X4 Modding Wiki."
title: "[Correction] "
body:
  - type: input
    id: page
    attributes:
      label: "Страница вики или новая тема"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: "Что нужно добавить или исправить?"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Предлагаемый текст или ожидаемый результат"
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: "Версия X4 и используемые моды"
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: "Область материала"
      options: ["XML / данные игры", "MD / AI", "Lua UI / FFI", "Типы и методы", "Перевод / другое"]
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: "Что уже проверено?"
      options: ["Идея / пока не проверено","Прочитано в источнике","Проверен отдельный пример вне игры","Проверен конкретный сценарий в игре"]
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: "Источники и примеры"
      description: "Укажите первичные ссылки, короткий собственный код и шаги проверки. Неизвестное можно обозначить прямо."
    validations:
      required: false

  - type: checkboxes
    id: public_content
    attributes:
      label: "Только публичные материалы"
      options:
        - label: "Нет файлов мода, внутренних документов, полных исходников, секретов или личных данных."
          required: true
